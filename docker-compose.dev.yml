#version: "3.9"
name: dev-events-service

services:
  events-service:
    container_name: dev-events-service
    build: .

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    env_file:
      - ${ENV_COMMON_PATH:-../../config/.env.common}
      - ${ENV_COMMON_PATH:-../../config/.env.secrets}
      - .env.staging

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4011/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    expose:
      - "4011"

    environment:
      LOG_ROOT: /var/log/projectshell

    volumes:
      - /home/deploy/logs:/var/log/projectshell
    restart: always

    networks:
      - gateway_dev-net

networks:
  gateway_dev-net:
    external: true
